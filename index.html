<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unified GST Calculator</title>
  <style>
    /* Basic Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    /* Container styling */
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #555;
    }
    input[type="number"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
    }
    .note {
      margin-top: 15px;
      font-size: 14px;
      color: #777;
    }
    #gstAmount {
      margin-top: 20px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>GST Calculator</h1>
    
    <label for="gstRate">GST Rate (%)</label>
    <input type="number" id="gstRate" step="0.01" placeholder="Enter GST rate" required>
    
    <label for="priceEx">Price (GST Excluded / Base Price)</label>
    <input type="number" id="priceEx" step="0.01" placeholder="Enter price without GST">
    
    <label for="priceIn">Price (GST Included / Final Price)</label>
    <input type="number" id="priceIn" step="0.01" placeholder="Enter price with GST">
    
    <div class="note">
      * Enter a value in either the <strong>GST Excluded</strong> field or the <strong>GST Included</strong> field. The other value and the GST amount will be calculated automatically.
    </div>
    
    <div id="gstAmount"></div>
  </div>

  <script>
    // Get DOM elements
    const gstRateInput = document.getElementById("gstRate");
    const priceExInput = document.getElementById("priceEx");
    const priceInInput = document.getElementById("priceIn");
    const gstAmountDiv = document.getElementById("gstAmount");

    // To prevent event recursion when updating fields programmatically
    let isUpdating = false;
    // Track which field the user last edited: "ex" for GST Excluded or "in" for GST Included
    let activeField = null;

    // Function to update based on the GST Excluded (base) price
    function updateFromExcluded() {
      const exVal = parseFloat(priceExInput.value);
      const rateVal = parseFloat(gstRateInput.value);
      if (isNaN(exVal) || isNaN(rateVal)) {
        priceInInput.value = "";
        gstAmountDiv.textContent = "";
        return;
      }
      const inVal = exVal * (1 + rateVal / 100);
      const gstAmt = inVal - exVal;
      isUpdating = true;
      priceInInput.value = inVal.toFixed(2);
      gstAmountDiv.textContent = "GST Amount: " + gstAmt.toFixed(2);
      isUpdating = false;
    }

    // Function to update based on the GST Included (final) price
    function updateFromIncluded() {
      const inVal = parseFloat(priceInInput.value);
      const rateVal = parseFloat(gstRateInput.value);
      if (isNaN(inVal) || isNaN(rateVal)) {
        priceExInput.value = "";
        gstAmountDiv.textContent = "";
        return;
      }
      const exVal = inVal / (1 + rateVal / 100);
      const gstAmt = inVal - exVal;
      isUpdating = true;
      priceExInput.value = exVal.toFixed(2);
      gstAmountDiv.textContent = "GST Amount: " + gstAmt.toFixed(2);
      isUpdating = false;
    }

    // Listen for input events on GST Excluded field
    priceExInput.addEventListener("input", function () {
      if (isUpdating) return;
      activeField = "ex";
      // If the user clears the field, clear the calculated fields as well.
      if (priceExInput.value.trim() === "") {
        isUpdating = true;
        priceInInput.value = "";
        gstAmountDiv.textContent = "";
        isUpdating = false;
        return;
      }
      updateFromExcluded();
    });

    // Listen for input events on GST Included field
    priceInInput.addEventListener("input", function () {
      if (isUpdating) return;
      activeField = "in";
      if (priceInInput.value.trim() === "") {
        isUpdating = true;
        priceExInput.value = "";
        gstAmountDiv.textContent = "";
        isUpdating = false;
        return;
      }
      updateFromIncluded();
    });

    // Listen for changes in GST Rate and update accordingly
    gstRateInput.addEventListener("input", function () {
      // If the GST rate is cleared or invalid, clear calculated values.
      if (gstRateInput.value.trim() === "" || parseFloat(gstRateInput.value) < 0) {
        isUpdating = true;
        priceExInput.value = "";
        priceInInput.value = "";
        gstAmountDiv.textContent = "";
        isUpdating = false;
        return;
      }
      // Recalculate based on the last active field.
      if (activeField === "ex") {
        updateFromExcluded();
      } else if (activeField === "in") {
        updateFromIncluded();
      }
    });
  </script>
</body>
</html>
